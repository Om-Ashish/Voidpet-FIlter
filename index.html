<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voidpet · Filter study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@700&family=Saira:wght@500;600;700;800&family=Saira+Condensed:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --night-0:#0F0D33; --night-1:#24228A; --night-2:#3F42C6;
  --ink:#FFFFFF; --ink-soft:#DDE1FF; --lav:#A5B4FC; --pill:#3B82F6;
  --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.16);
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --ui:'Saira',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Saira Condensed','Saira','Arial Narrow',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The presentation is always in Voidpet's night-sky theme; tokens are restated for dark preferences on purpose. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#FFFFFF; --ink-soft:#DDE1FF; --lav:#A5B4FC; } }
:root[data-theme="dark"]{ --ink:#FFFFFF; --ink-soft:#DDE1FF; --lav:#A5B4FC; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overscroll-behavior:none;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--night-0);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #FFD66B;outline-offset:3px;border-radius:8px}

/* ---------- sky ---------- */
.sky{position:fixed;inset:0;background:linear-gradient(180deg,var(--night-0) 0%,var(--night-1) 58%,var(--night-2) 100%);overflow:hidden;z-index:0}
.sky .moon{position:absolute;left:-160px;top:-200px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(124,131,255,.36),rgba(124,131,255,0) 70%)}
.sky .star{position:absolute;border-radius:50%;background:#fff}
.sky svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:42vh}

/* ---------- site nav ---------- */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:48px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:5}
.logo{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.logo img{width:26px;height:26px}
.nav ul{display:flex;gap:6px;margin:0;padding:0;list-style:none}
.nav li{font:700 11px/1 var(--mono);letter-spacing:.06em;padding:8px 12px;border-radius:4px;color:#fff}
.nav li.on{background:#1E2147;color:var(--lav)}

/* ---------- stage & slides ---------- */
.stage{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(64px + env(safe-area-inset-bottom,0px));overflow:hidden;z-index:2;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .65s cubic-bezier(.65,0,.2,1);will-change:transform}
.slide{flex:0 0 100%;height:100%;display:grid;grid-template-columns:minmax(280px,400px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:clamp(24px,3.5vw,56px);row-gap:clamp(8px,1.4vh,14px);padding:clamp(16px,2.6vh,26px) clamp(24px,4vw,64px) 6px}
.slide > header{grid-column:1/-1;text-align:center}
.tag{display:inline-block;vertical-align:middle;background:var(--pill);color:#fff;font:700 10px/1 var(--mono);letter-spacing:.06em;padding:5px 10px;border-radius:10px}
.slide h1{display:inline-block;vertical-align:middle;font-family:var(--display);font-weight:400;font-size:clamp(20px,1.9vw,28px);line-height:1.1;margin:0 0 0 12px;text-shadow:0 3px 0 rgba(10,6,60,.55)}
.sub{margin:6px auto 0;max-width:70ch;color:var(--ink-soft);font-weight:500;font-size:clamp(13px,1vw,15px)}
.copy{align-self:center;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);max-width:400px}
.block h2{margin:0 0 6px;font:700 11px/1 var(--mono);letter-spacing:.1em;color:var(--lav)}
.block p{margin:0;font-weight:500;font-size:clamp(14px,1.08vw,16px);line-height:1.45;color:var(--ink-soft)}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.points li{display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1vw,15px);line-height:1.3}
.points i{flex:0 0 30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);display:grid;place-items:center}
.points i svg{width:14px;height:14px}
.score{display:inline-flex;align-items:center;gap:14px;padding:10px 18px 10px 14px;border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);align-self:flex-start}
.score b{font:400 30px/1 var(--display)}
.score span{display:flex;flex-direction:column;gap:3px}
.score small{font:700 11px/1 var(--mono);letter-spacing:.08em;color:var(--lav)}
.score em{font-style:normal;font-weight:700;font-size:13px;color:var(--ink-soft)}
.panel{position:relative;min-height:0;border-radius:24px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;gap:clamp(24px,3.5vw,56px);padding:10px 16px 12px}
.device{display:flex;flex-direction:column;align-items:center;gap:8px}
.mode{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.1);font:700 10px/1 var(--mono);letter-spacing:.08em}
.mode::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.mode.dark::before{background:#17163A}
.pwrap{width:calc(390px * var(--s,.6));height:calc(844px * var(--s,.6));position:relative;border-radius:calc(36px * var(--s,.6));box-shadow:0 18px 40px rgba(5,3,30,.45)}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(24px,5vw,72px);z-index:4}
.count{font:700 11px/1 var(--mono);letter-spacing:.08em;color:var(--lav)}
.pager{display:flex;align-items:center;gap:18px}
.arrow{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);color:#fff;transition:transform .15s}
.arrow svg{width:20px;height:20px}
.arrow.next{background:#fff;color:#3F42C6;box-shadow:0 4px 0 #2A2C9E}
.arrow:active{transform:translateY(2px)}
.arrow[disabled]{opacity:.35;cursor:default}
.dots{display:flex;gap:8px}
.dots button{width:8px;height:8px;border-radius:4px;border:0;padding:0;background:rgba(255,255,255,.3);cursor:pointer;transition:width .3s,background .3s}
.dots button.on{width:28px;background:#fff}
.nextlbl{justify-self:end;border:0;background:none;cursor:pointer;font:700 11px/1 var(--mono);letter-spacing:.08em;color:var(--lav);padding:8px 0}

/* ============ PHONE (390×844 native, scaled) ============ */
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--s,.6));transform-origin:0 0;border-radius:36px;overflow:hidden;background:var(--sheet);font-family:var(--ui);color:var(--text);user-select:none;-webkit-user-select:none;text-align:left}
.phone[data-theme=light]{--header:#5660E6;--sheet:#F1F1F5;--tray:#FFFFFF;--chip:#FFFFFF;--border:#DCDCE8;--text:#17161F;--text2:#6B6A80;--onh:#FFFFFF;--onhm:#C3C8FF;--accent:#5660E6;--red:#E25444;--foe:#6C74F2;--selbg:#E9EBFF;--sbtn:#E4E4EC;--glow:.22;--lbl:#1C8FB0}
.phone[data-theme=dark]{--header:#17163A;--sheet:#13121C;--tray:#1E1D2C;--chip:#2A2940;--border:#3B3A58;--text:#FFFFFF;--text2:#A5B4FC;--onh:#FFFFFF;--onhm:#8F95E0;--accent:#7C83FF;--red:#FF6B5A;--foe:#2B2A5C;--selbg:#30326A;--sbtn:#24233A;--glow:.34;--lbl:#36C3EC}
:where(.phone button){cursor:pointer;border:0;padding:0;background:none}
.phone .inert{pointer-events:none}
.hd{position:absolute;left:0;top:0;width:390px;height:336px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.2)),var(--header)}
.hd .st{position:absolute;border-radius:50%;background:rgba(255,255,255,.35)}
.hd .back{position:absolute;left:16px;top:58px;width:26px;height:26px;color:var(--onh)}
.hd .ttl{position:absolute;left:0;right:0;top:40px;text-align:center;font:400 46px/1.2 var(--display);color:var(--onh)}
.hd .bp{position:absolute;left:0;right:0;top:91px;text-align:center;font:800 15px/1.3 var(--ui);letter-spacing:.02em;color:var(--onhm)}
.hd .bp span{font-weight:500}
.hd .pass{position:absolute;left:344px;top:58px;width:26px;height:26px;color:var(--onh)}
.hd .pdot{position:absolute;left:362px;top:54px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.slot{position:absolute;top:126px;width:92px;display:flex;flex-direction:column;align-items:center}
.slot .lv{display:flex;align-items:center;gap:3px;font:800 12px/1.3 var(--ui);color:var(--onhm)}
.slot .lv svg{width:14px;height:14px}
.stg{position:relative;width:88px;height:92px}
.stg .gl{position:absolute;left:-2px;top:-4px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,var(--glow)),rgba(255,255,255,0) 70%)}
.stg .sh{position:absolute;top:78px;height:12px;border-radius:50%;background:rgba(0,0,0,.18)}
.stg img{position:absolute;left:1px;top:0;width:86px;height:86px}
.slot .nm{display:flex;align-items:center;gap:4px;font:500 11px/1.3 var(--ui);letter-spacing:.03em;color:#B1BCF5}
.slot .nm svg{width:12px;height:12px;color:#fff}
.foe{position:absolute;left:214px;top:262px;width:176px;height:58px;border-radius:18px 0 0 18px;background:var(--foe)}
.foe .f1{position:absolute;left:20px;top:8px;font:700 8px/1.3 var(--mono);letter-spacing:.06em;color:var(--onhm)}
.foe .f2{position:absolute;left:20px;top:21px;font:400 15px/1.2 var(--display);color:var(--onh)}
.foe .f3{position:absolute;left:20px;top:38px;font:800 10px/1.4 var(--ui);color:var(--onhm)}
.foe .f3 span{font-weight:500}
.foe .lv{position:absolute;left:102px;top:-2px;display:flex;align-items:center;gap:3px;font:500 10px/1.5 var(--ui);color:var(--onhm)}
.foe .lv svg{width:14px;height:14px}
.foe img{position:absolute;left:109px;top:18px;width:45px;height:45px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.sheet{position:absolute;left:0;top:326px;width:390px;height:518px;border-radius:28px 28px 0 0;background:var(--sheet);overflow:hidden}
.scroll{height:100%;overflow-y:auto;scrollbar-width:none;padding:14px 12px 96px;display:flex;flex-direction:column;gap:12px}
.scroll::-webkit-scrollbar{display:none}
.trow{display:flex;align-items:center;justify-content:space-between;height:38px;flex:none}
.trow h3{margin:0;font:400 22px/1 var(--display);color:var(--text)}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sbtn);color:var(--text);position:relative;flex:none}
.ibtn svg{width:19px;height:19px}
.ibtn.gridb svg{width:17px;height:17px}
.ibtn.active{background:var(--accent);color:#fff}
.ibtn.pressed{box-shadow:inset 0 0 0 2px var(--accent)}
.badge{position:absolute;right:-6px;top:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:800 11px/18px var(--ui);text-align:center;box-shadow:0 0 0 2px var(--sheet)}
.ph{width:38px;height:38px}
.lbl{font:700 10px/1.2 var(--mono);letter-spacing:.08em;color:var(--text2)}
.tray{flex:none;background:var(--tray);border-radius:20px;box-shadow:inset 0 0 0 1px var(--border);padding:12px;display:flex;flex-direction:column;gap:8px}
.tray.enter{animation:trayIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes trayIn{from{opacity:0;transform:translateY(-8px) scaleY(.94);transform-origin:top}to{opacity:1;transform:none}}
.hrow{display:flex;align-items:center;justify-content:space-between}
.tagp{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:12px;background:color-mix(in srgb,#36C3EC 20%,transparent);font:800 10px/1.4 var(--ui);letter-spacing:.03em;color:var(--text)}
.tagp svg{width:11px;height:11px}
.crow{display:flex;justify-content:center;gap:14px}
.chip{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;transition:box-shadow .15s,background .15s,transform .1s}
.chip:active{transform:scale(.93)}
.chip svg{width:22px;height:22px}
.chip.el{background:color-mix(in srgb,var(--c) 18%,var(--chip))}
.chip.el.on{background:color-mix(in srgb,var(--c) 34%,var(--chip));box-shadow:0 0 0 2.5px var(--c)}
.chip.rl{background:var(--sbtn);color:var(--text)}
.chip.rl svg{width:20px;height:20px}
.chip.rl.on{background:var(--accent);color:#fff}
.adv{position:absolute;right:-4px;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--chip);box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;pointer-events:none}
.adv svg{width:12px;height:12px}
.res{flex:none;display:flex;justify-content:space-between;align-items:center;font:800 12px/1.5 var(--ui);letter-spacing:.03em;color:var(--text2);min-height:18px}
.res button{font:800 12px/1.5 var(--ui);letter-spacing:.03em;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(5,66px);gap:9px;flex:none}
.card{width:66px;height:88px;border-radius:12px;position:relative;overflow:hidden;background:var(--cb);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);animation:pop .22s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;left:0;right:0;top:34px;height:40px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.12))}
.card img{position:absolute;left:1px;top:6px;width:64px;height:64px}
.card .tm{position:absolute;left:0;top:0;width:66px;height:68px;background:rgba(14,13,26,.55);display:grid;place-items:center}
.card .tm i{width:30px;height:30px;border-radius:50%;background:#35A98C;box-shadow:0 0 0 2.5px #fff;display:grid;place-items:center;color:#fff}
.card .tm i svg{width:16px;height:16px}
.card .ce{position:absolute;left:4px;top:4px;width:13px;height:13px}
.card .cl{position:absolute;left:19px;top:1px;font:800 10px/1.4 var(--ui);color:#fff}
.card .cb{position:absolute;left:0;bottom:0;width:66px;height:20px;background:#0E0D16;display:flex;align-items:center;gap:3px;padding:0 3px 0 4px;color:#fff}
.card .cb svg{width:11px;height:11px;flex:none}
.card .cb b{font:800 10px/1 var(--cond);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;padding:18px 14px;border-radius:16px;background:var(--tray);box-shadow:inset 0 0 0 1px var(--border);font:700 13px/1.4 var(--ui);color:var(--text2);text-align:center}
.empty b{display:block;font:400 15px/1.3 var(--display);color:var(--text);margin-bottom:4px}
.acts{position:absolute;left:0;top:762px;width:390px;height:82px;background:var(--sheet)}
.acts::before{content:"";position:absolute;left:0;right:0;top:-28px;height:28px;background:linear-gradient(180deg,transparent,var(--sheet))}
.bb{position:absolute;top:4px;width:175px;height:54px;border-radius:27px;display:grid;place-items:center;font:400 16px/1 var(--display);color:#fff;box-shadow:0 5px 0 var(--lip),inset 0 3px 0 rgba(255,255,255,.25)}
.bb.auto{left:14px;background:var(--accent);--lip:#3B42B8}
.bb.fight{left:201px;background:var(--red);--lip:#B23B2E;font-size:20px}
/* P2 banner */
.ban{flex:none;display:flex;align-items:center;gap:10px;padding:12px;border-radius:20px;background:var(--tray);box-shadow:inset 0 0 0 1.5px #36C3EC}
.ban .bi{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,#36C3EC 20%,transparent);display:grid;place-items:center;flex:none}
.ban .bi svg{width:24px;height:24px}
.ban .bt{flex:1;display:flex;flex-direction:column;gap:1px}
.ban .bt small{font:700 10px/1.3 var(--mono);letter-spacing:.08em;color:var(--text2)}
.ban .bt strong{font:800 13px/1.3 var(--ui);letter-spacing:.02em}
.ban .go{padding:8px 12px;border-radius:16px;background:#36C3EC;color:#0B3B4A;font:800 11px/1.2 var(--ui);letter-spacing:.03em;box-shadow:0 3px 0 #1F87A8}
.ban .go.undo{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--border)}
/* P3 strip */
.strip{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:22px;background:var(--tray);box-shadow:inset 0 0 0 1px var(--border)}
.strip .chip{width:32px;height:32px}
.strip .chip svg{width:18px;height:18px}
.strip .chip.rl svg{width:15px;height:15px}
.strip .dv{width:1px;height:22px;background:var(--border)}
/* overlays */
.back-catch{position:absolute;inset:0;z-index:6}
.pop{position:absolute;left:12px;top:392px;width:300px;z-index:7;background:var(--chip);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 32px rgba(13,10,38,.28);animation:popIn .22s cubic-bezier(.2,.8,.2,1)}
.pop::before{content:"";position:absolute;left:24px;top:-9px;border:10px solid transparent;border-top:0;border-bottom:10px solid var(--chip)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97);transform-origin:20px 0}to{opacity:1;transform:none}}
.pop h4,.bs h4{margin:0;font:400 18px/1 var(--display);color:var(--text)}
.scrim{position:absolute;inset:0;z-index:6;background:rgba(7,6,26,.5);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.bs{position:absolute;left:0;bottom:0;width:390px;z-index:7;background:var(--tray);border-radius:28px 28px 0 0;padding:10px 16px 30px;display:flex;flex-direction:column;gap:12px;align-items:stretch;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--border);align-self:center}
.pair{display:flex;gap:12px}
.pb{height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;font:400 18px/1 var(--display)}
.pb.clr{width:124px;flex:none;background:var(--sbtn);color:var(--text);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--chip) 75%,transparent),0 2px 6px rgba(0,0,0,.08)}
.pb.clr svg{width:15px;height:15px}
.pb.app{flex:1;background:var(--accent);color:#fff;box-shadow:inset 0 0 0 6px rgba(255,255,255,.16)}
.pb:active{transform:translateY(1px)}
/* P6 wheel */
.wheel{position:relative;height:64px;touch-action:none;cursor:grab}
.wheel.rw{height:56px}
.wi{position:absolute;left:50%;top:50%;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);border-radius:50%;display:grid;place-items:center;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s,box-shadow .2s,background .2s}
.wi svg{width:50%;height:50%}
.wi.rl svg{width:42%;height:42%}
.wi.el{background:color-mix(in srgb,var(--c) 18%,var(--chip))}
.wi.el.on{background:color-mix(in srgb,var(--c) 34%,var(--chip));box-shadow:0 0 0 2.5px var(--c)}
.wi.rl,.wi.all{background:var(--sbtn);color:var(--text)}
.wi.all span{font:400 14px/1 var(--display)}
.wi.on.rl,.wi.on.all{background:var(--accent);color:#fff}
.cap{text-align:center;font:800 12px/1.4 var(--ui);letter-spacing:.06em}
/* P7 drum */
.drum{position:relative;height:164px;border-radius:16px;background:var(--sbtn);overflow:hidden;touch-action:none}
.drum .div{position:absolute;left:0;right:0;top:82px;height:1px;background:var(--border)}
.lens{position:absolute;left:50%;top:8px;width:64px;height:148px;margin-left:-32px;border-radius:16px;background:var(--chip);box-shadow:inset 0 0 0 2px var(--accent),0 3px 0 rgba(0,0,0,.12)}
.lens small{position:absolute;left:0;right:0;text-align:center;font:700 7px/1 var(--mono);letter-spacing:.08em;color:var(--text2)}
.dz{position:absolute;left:0;right:0;height:82px;cursor:grab}
.dz.r2{top:82px}
.di{position:absolute;left:50%;top:41px;width:60px;margin-left:-30px;display:flex;flex-direction:column;align-items:center;gap:3px;transform-origin:center;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .34s}
.di .dc{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.di .dc svg{width:21px;height:21px}
.di.rl .dc svg{width:18px;height:18px}
.di.el .dc{background:color-mix(in srgb,var(--c) 18%,var(--chip))}
.di.rl .dc{background:var(--chip);color:var(--text)}
.di b{font:500 11px/1 var(--ui);letter-spacing:.04em;white-space:nowrap}
.di.on b{font-weight:800;color:var(--lbl)}
.di.on.rl b,.di.on.all b{color:var(--text)}
.di.all .dc{background:none;width:auto;font:400 17px/36px var(--display)}
.tick{position:absolute;width:1.5px;height:6px;background:var(--text2)}
.fadeL,.fadeR{position:absolute;top:0;bottom:0;width:70px;pointer-events:none}
.fadeL{left:0;background:linear-gradient(90deg,var(--sbtn),transparent)}
.fadeR{right:0;background:linear-gradient(270deg,var(--sbtn),transparent)}
.readout{text-align:center;font:800 12px/1.4 var(--ui);letter-spacing:.04em}
/* P8 full screen */
.full{position:absolute;inset:0;z-index:7;background:var(--sheet);animation:up .32s cubic-bezier(.2,.8,.2,1)}
.full .top{position:absolute;left:12px;right:12px;top:54px;height:38px;display:flex;align-items:center;justify-content:space-between}
.full .top h4{margin:0;font:400 22px/1 var(--display)}
.full .body{position:absolute;left:12px;top:110px;width:366px;display:flex;flex-direction:column;gap:12px}
.full .tagp{align-self:flex-start}
.rcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc{text-align:left;padding:12px;border-radius:16px;background:var(--chip);box-shadow:inset 0 0 0 1.5px var(--border),0 3px 0 rgba(0,0,0,.06);display:flex;flex-direction:column;gap:4px}
.rc.on{background:var(--selbg);box-shadow:inset 0 0 0 2px var(--accent)}
.rc span{display:flex;align-items:center;gap:6px;font:800 14px/1.2 var(--ui);letter-spacing:.03em;color:var(--text)}
.rc span svg{width:18px;height:18px}
.rc small{font:700 11px/1.35 var(--ui);color:var(--text2)}
.pv{background:var(--tray);border-radius:20px;box-shadow:inset 0 0 0 1px var(--border);padding:12px;display:flex;flex-direction:column;gap:8px}
.pv strong{font:400 18px/1.1 var(--display)}
.thumbs{display:flex;gap:8px}
.thumbs div{width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--cb);display:grid;place-items:center;font:800 13px/1 var(--ui);color:#fff}
.thumbs img{width:52px;height:52px}
.full .pair{position:absolute;left:12px;top:756px;width:366px}

@media (prefers-reduced-motion: reduce){
  .track,.wi,.di,.dots button{transition:none}
  .card,.tray.enter,.pop,.bs,.full,.scrim{animation:none}
}
@media (max-width: 900px){
  body{overflow:auto}
  .stage{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .slide{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;overflow-y:auto;align-content:start}
  .copy{max-width:none;order:3}
  .panel{min-height:auto;flex-wrap:nowrap;padding:12px}
  .nav ul{display:none}
  .count,.nextlbl{display:none}
  .bar{grid-template-columns:1fr}
  .pager{justify-self:center}
}
</style>
</head>

/* ---------------- helpers ---------------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const match=(p,el,rl)=>(!el||p.el===el)&&(!rl||p.r===rl);
const results=(el,rl)=>PETS.filter(p=>match(p,el,rl));
function summary(el,rl){const n=results(el,rl).length; if(!el&&!rl) return 'ALL '+n+' PETS';
 const what=(el?el.toUpperCase()+' ':'')+(n===1?'PET':'PETS'); return n+' '+what+' \u00b7 '+(rl?rl.toUpperCase()+(n===1?'':'S'):'ANY ROLE');}
const elChip=(el,on,act,adv=true)=>`<button class="chip el${on?' on':''}" style="--c:${EC[el]}" data-act="${act}" aria-pressed="${on}" aria-label="${el}${adv&&el===COUNTER?', strong against '+FOE:''}">${SVG.el[el]}${adv&&el===COUNTER?`<span class="adv">${SVG.adv}</span>`:''}</button>`;
const rlChip=(r,on,act)=>`<button class="chip rl${on?' on':''}" data-act="${act}" aria-pressed="${on}" aria-label="${r}">${SVG.rl[r]}</button>`;
const elRow=(sel,prefix)=>`<div class="crow">${ELS.map(e=>elChip(e,sel===e,prefix+e)).join('')}</div>`;
const rlRow=(sel,prefix)=>`<div class="crow">${ROLES.map(r=>rlChip(r,sel===r,prefix+r)).join('')}</div>`;

function header(){
 const stars=[[40,30,3],[120,70,2],[300,40,2.5],[350,110,2],[70,120,2],[210,22,2]].map(([x,y,r])=>`<i class="st" style="left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px"></i>`).join('');
 const slots=TEAM.map((k,i)=>{const p=PETS.find(x=>x.k===k);const [sw,sx]=SHADOW[k];
  return `<div class="slot" style="left:${3+i*96}px"><div class="lv">${SVG.el[p.el]}Lv${p.lv}</div><div class="stg"><i class="gl"></i><i class="sh" style="left:${sx}px;width:${sw}px"></i><img src="${ART[k]}" alt="" style="${k==='lust'?'top:3px':''}"></div><div class="nm">${SVG.rl[p.r]}${p.n.toUpperCase()}</div></div>`;}).join('');
 return `<div class="hd inert" aria-hidden="true">${stars}<span class="back">${SVG.chev}</span><div class="ttl">TEAM</div><div class="bp"><span>BP</span>:1503076</div><span class="pass">${SVG.pass}</span><i class="pdot"></i>${slots}
  <div class="foe"><span class="f1">FLOOR 1660</span><span class="f2">FOES</span><span class="f3"><span>BP</span>:1114216</span><span class="lv">${SVG.el.Fire}Lv135</span><img src="${ART.foe}" alt=""></div></div>`;
}
function card(p){const tm=TEAM.includes(p.k);
 return `<div class="card inert" style="--cb:${CB[p.el]}"><img src="${ART[p.k]}" alt="">${tm?`<div class="tm"><i>${SVG.check}</i></div>`:''}<span class="ce">${SVG.el[p.el]}</span><span class="cl">Lv${p.lv}</span><div class="cb">${SVG.rl[p.r]}<b>${p.n.toUpperCase()}</b></div></div>`;}
function grid(el,rl){const list=results(el,rl);
 if(!list.length) return `<div class="grid"><div class="empty"><b>No ${el?el+' ':''}${rl?rl.toLowerCase()+'s':'pets'} yet</b>Try another role, or clear the filter.</div></div>`;
 return `<div class="grid" aria-label="${summary(el,rl)}">${list.map(card).join('')}</div>`;}
function resRow(el,rl,clearAct='clear'){const any=el||rl; return `<div class="res" aria-live="polite"><span>${summary(el,rl)}</span>${any?`<button data-act="${clearAct}">CLEAR ALL</button>`:''}</div>`;}
function titleRow(st,{noFilter}={}){const n=(st.el?1:0)+(st.rl?1:0);
 const fb=noFilter?'<span class="ph"></span>':`<button class="ibtn${n?' active':''}${st.open&&!n?' pressed':''}" data-act="toggle" aria-expanded="${!!st.open}" aria-label="Filter pets${n?', '+n+' active':''}">${SVG.filter}${n?`<span class="badge">${n}</span>`:''}</button>`;
 return `<div class="trow">${fb}<h3>CHOOSE PETS</h3><span class="ibtn gridb inert" aria-hidden="true">${SVG.grid}</span></div>`;}
const actions=()=>`<div class="acts inert" aria-hidden="true"><span class="bb auto">AUTO BATTLE</span><span class="bb fight">BATTLE</span></div>`;
const tray=(st,enter)=>`<div class="tray${enter?' enter':''}"><div class="hrow"><span class="lbl">ELEMENT</span><span class="tagp">${SVG.spark}BEST VS FIRE: WATER</span></div>${elRow(st.el,'el:')}<span class="lbl">ROLE</span>${rlRow(st.rl,'rl:')}</div>`;
const pair=()=>`<div class="pair"><button class="pb clr" data-act="pclear">${SVG.close}CLEAR</button><button class="pb app" data-act="apply">APPLY</button></div>`;

/* ---------------- per-pattern renderers ---------------- */
function body(st){
 const enter=st._enter; st._enter=false;
 switch(st.p){
  case 1: return titleRow(st)+(st.open?tray(st,enter):'')+((st.el||st.rl||st.open)?resRow(st.el,st.rl):'')+grid(st.el,st.rl);
  case 2: {const on=st.el===COUNTER&&!st.rl;
   const ban=`<div class="ban"><span class="bi">${SVG.el.Water}</span><span class="bt"><small>FOE IS FIRE</small><strong>${on?'SHOWING WATER PETS':'WATER PETS HIT HARDER'}</strong></span><button class="go${on?' undo':''}" data-act="${on?'clear':'counter'}">${on?'UNDO':'SHOW WATER'}</button></div>`;
   return titleRow(st)+ban+(st.open?tray(st,enter):'')+((st.el||st.rl)?resRow(st.el,st.rl):'')+grid(st.el,st.rl);}
  case 3: {const strip=`<div class="strip">${ELS.map(e=>elChip(e,st.el===e,'el:'+e,false)).join('')}<i class="dv"></i>${ROLES.map(r=>rlChip(r,st.rl===r,'rl:'+r)).join('')}</div>`;
   return titleRow(st,{noFilter:true})+strip+resRow(st.el,st.rl)+grid(st.el,st.rl);}
  case 4: case 5: case 8: return titleRow(st)+((st.el||st.rl)?resRow(st.el,st.rl):'')+grid(st.el,st.rl);
  case 6: return titleRow(st)+(st.open?`<div class="tray${enter?' enter':''}"><span class="lbl">ELEMENT</span><div class="wheel" data-wheel="el"></div><div class="cap" data-cap></div><span class="lbl">ROLE</span><div class="wheel rw" data-wheel="rl"></div></div>`:'')+`<div data-res>${resRow(st.el,st.rl)}</div><div data-grid>${grid(st.el,st.rl)}</div>`;
  case 7: {let ticks='';for(const y of [2,156])for(let a=-80;a<=80;a+=8){const t=a*Math.PI/180;ticks+=`<i class="tick" style="left:${171+165*Math.sin(t)}px;top:${y}px;opacity:${(0.15+0.45*Math.cos(t)).toFixed(2)}"></i>`;}
   return titleRow(st)+(st.open?`<div class="tray${enter?' enter':''}"><div class="hrow" style="justify-content:center"><span class="lbl" style="font-size:9px">SWIPE TO SPIN</span></div><div class="drum"><i class="div"></i><div class="lens"><small style="top:8px">ELEMENT</small><small style="top:89px">ROLE</small></div><div class="dz" data-drum="el"></div><div class="dz r2" data-drum="rl"></div>${ticks}<i class="fadeL"></i><i class="fadeR"></i></div><div class="readout" data-readout></div></div>`:'')+`<div data-res>${st.open?'':resRow(st.el,st.rl)}</div><div data-grid>${grid(st.el,st.rl)}</div>`;}
 }
}
function overlay(st){
 if(!st.open) return '';
 if(st.p===4) return `<div class="back-catch" data-act="close"></div><div class="pop" role="dialog" aria-label="Filter pets"><h4>FILTER PETS</h4><span class="lbl">ELEMENT</span>${elRow(st.pel,'pel:')}<span class="lbl">ROLE</span>${rlRow(st.prl,'prl:')}${pair()}</div>`;
 if(st.p===5) return `<div class="scrim" data-act="close"></div><div class="bs" role="dialog" aria-label="Filter pets"><i class="grab"></i><h4>FILTER PETS</h4><span class="lbl">ELEMENT</span>${elRow(st.pel,'pel:')}<span class="lbl">ROLE</span>${rlRow(st.prl,'prl:')}${pair()}</div>`;
 if(st.p===8){const list=results(st.pel,st.prl);
  const th=list.slice(0,5).map(p=>`<div style="--cb:${CB[p.el]}"><img src="${ART[p.k]}" alt=""></div>`).join('')+(list.length>5?`<div style="--cb:var(--chip);color:var(--text)">+${list.length-5}</div>`:'');
  return `<div class="full" role="dialog" aria-label="Filter pets"><div class="top"><button class="ibtn" data-act="close" aria-label="Close filters">${SVG.close}</button><h4>FILTER PETS</h4><span class="ph"></span></div>
  <div class="body"><span class="tagp">${SVG.spark}FOE IS FIRE \u00b7 WATER IS STRONGEST</span><span class="lbl">ELEMENT</span>${elRow(st.pel,'pel:')}<span class="lbl">ROLE</span>
  <div class="rcards">${ROLES.map(r=>`<button class="rc${st.prl===r?' on':''}" data-act="prl:${r}" aria-pressed="${st.prl===r}"><span>${SVG.rl[r]}${r.toUpperCase()}</span><small>${ROLE_DESC[r]}</small></button>`).join('')}</div>
  <div class="pv"><strong>${list.length} ${list.length===1?'PET MATCHES':'PETS MATCH'}</strong><span class="lbl">${st.pel?st.pel.toUpperCase():'ANY ELEMENT'} \u00b7 ${st.prl?st.prl.toUpperCase():'ANY ROLE'}</span><div class="thumbs">${th||'<span class="lbl">Nothing matches yet. Try another role.</span>'}</div></div></div>${pair()}</div>`;}
 return '';
}

/* ---------------- carousels (P6, P7) ---------------- */
function cyc(i,sel,n){let d=i-sel; if(d>n/2)d-=n; if(d<-n/2)d+=n; return d;}
function buildWheel(root,st,kind){
 const opts=kind==='el'?WHEEL_EL:WHEEL_RL; const box=root.querySelector(`[data-wheel=${kind}]`); if(!box) return;
 const base=kind==='el'?60:52;
 box.innerHTML=opts.map((o,i)=>{const isAll=o==='All'; const cls=isAll?'all':(kind==='el'?'el':'rl');
  const inner=isAll?'<span>ALL</span>':(kind==='el'?SVG.el[o]:SVG.rl[o]);
  return `<button class="wi ${cls}" data-act="w${kind}:${i}" style="--d:${base}px;${kind==='el'&&!isAll?'--c:'+EC[o]:''}" aria-label="${o}">${inner}</button>`;}).join('');
 layoutWheel(root,st,kind);
 swipeable(box,dir=>{const n=opts.length; const cur=wheelIndex(st,kind); setWheel(root,st,kind,(cur+dir+n)%n);});
}
function wheelIndex(st,kind){const opts=kind==='el'?WHEEL_EL:WHEEL_RL; const v=kind==='el'?st.el:st.rl; return opts.indexOf(v||'All');}
function layoutWheel(root,st,kind){
 const opts=kind==='el'?WHEEL_EL:WHEEL_RL; const box=root.querySelector(`[data-wheel=${kind}]`); if(!box) return;
 const sel=wheelIndex(st,kind); const base=kind==='el'?60:52; const off=kind==='el'?[0,60,105,140]:[0,56,101,136];
 [...box.children].forEach((b,i)=>{const d=cyc(i,sel,opts.length); const a=Math.abs(d);
  const sc=a===0?1:a===1?40/base:a===2?30/base:22/base; const op=a===0?1:a===1?.65:a===2?.35:0;
  b.style.transform=`translateX(${Math.sign(d)*off[Math.min(a,3)]}px) scale(${sc})`; b.style.opacity=op; b.style.pointerEvents=a>2?'none':'';
  b.classList.toggle('on',a===0); b.setAttribute('aria-pressed',a===0); b.tabIndex=a>2?-1:0;});
 if(kind==='el'){const cap=root.querySelector('[data-cap]'); if(cap) cap.textContent='\u2039  '+(st.el?st.el.toUpperCase():'ALL ELEMENTS')+'  \u203a';}
}
function setWheel(root,st,kind,i){const opts=kind==='el'?WHEEL_EL:WHEEL_RL; const v=opts[i]==='All'?null:opts[i]; if(kind==='el')st.el=v; else st.rl=v;
 layoutWheel(root,st,kind); refreshResults(root,st);}
function buildDrum(root,st,kind){
 const opts=kind==='el'?DRUM_EL:DRUM_RL; const zone=root.querySelector(`[data-drum=${kind}]`); if(!zone) return;
 zone.innerHTML=opts.map((o,i)=>{const isAll=o==='All'; const cls=isAll?'all':kind;
  const ic=isAll?'<span class="dc">ALL</span>':`<span class="dc">${kind==='el'?SVG.el[o]:SVG.rl[o]}</span>`;
  const lab=isAll?(kind==='el'?'ELEMENTS':'ROLES'):o.toUpperCase();
  return `<button class="di ${cls}" data-act="d${kind}:${i}" style="${kind==='el'&&!isAll?'--c:'+EC[o]:''}" aria-label="${o}">${ic}<b>${lab}</b></button>`;}).join('');
 layoutDrum(root,st,kind);
 swipeable(zone,dir=>{const n=opts.length; const cur=drumIndex(st,kind); setDrum(root,st,kind,(cur+dir+n)%n);});
}
function drumIndex(st,kind){const opts=kind==='el'?DRUM_EL:DRUM_RL; const v=kind==='el'?st.el:st.rl; return opts.indexOf(v||'All');}
function layoutDrum(root,st,kind){
 const opts=kind==='el'?DRUM_EL:DRUM_RL; const zone=root.querySelector(`[data-drum=${kind}]`); if(!zone) return; const sel=drumIndex(st,kind);
 [...zone.children].forEach((b,i)=>{const d=cyc(i,sel,opts.length); const a=Math.abs(d); const th=Math.max(-88,Math.min(88,d*32))*Math.PI/180; const c=Math.cos(th);
  const sc=d===0?1.04:Math.max(.5,c); b.style.transform=`translate(${150*Math.sin(th)}px,-50%) scale(${sc})`; b.style.opacity=d===0?1:a>2?0:Math.pow(c,1.6).toFixed(2);
  b.style.pointerEvents=a>2?'none':''; b.classList.toggle('on',d===0); b.setAttribute('aria-pressed',d===0); b.tabIndex=a>2?-1:0;});
 const ro=root.querySelector('[data-readout]'); if(ro) ro.textContent=summary(st.el,st.rl);
}
function setDrum(root,st,kind,i){const opts=kind==='el'?DRUM_EL:DRUM_RL; const v=opts[i]==='All'?null:opts[i]; if(kind==='el')st.el=v; else st.rl=v;
 layoutDrum(root,st,kind); refreshResults(root,st);}
function refreshResults(root,st){
 const g=root.querySelector('[data-grid]'); if(g) g.innerHTML=grid(st.el,st.rl);
 const r=root.querySelector('[data-res]'); if(r) r.innerHTML=(st.p===7&&st.open)?'':resRow(st.el,st.rl);
 const t=root.querySelector('.trow'); if(t){const tmp=document.createElement('div'); tmp.innerHTML=titleRow(st); t.replaceWith(tmp.firstElementChild);}
}
function swipeable(el,onDir){let x0=null,moved=false;
 el.addEventListener('pointerdown',e=>{x0=e.clientX;moved=false;e.stopPropagation();});
 el.addEventListener('pointermove',e=>{if(x0!==null&&Math.abs(e.clientX-x0)>8)moved=true;});
 el.addEventListener('pointerup',e=>{e.stopPropagation(); if(x0===null)return; const dx=e.clientX-x0; x0=null; if(Math.abs(dx)>24){onDir(dx<0?1:-1);}});
 el.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
 el.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>4){e.preventDefault();e.stopPropagation();const now=Date.now(); if(now-(el._w||0)>260){el._w=now;onDir(e.deltaX>0?1:-1);}}},{passive:false});
}

/* ---------------- phone controller ---------------- */
const INIT={1:{el:'Water',open:true},2:{},3:{el:'Water'},4:{el:'Water',open:true,pel:'Water'},5:{open:true,pel:'Water'},6:{el:'Water',open:true},7:{el:'Water',open:true},8:{open:true,pel:'Water'}};
function makePhone(p,theme){
 const st=Object.assign({p,el:null,rl:null,open:false,pel:null,prl:null,_enter:false},INIT[p]);
 const root=document.createElement('div'); root.className='phone'; root.dataset.theme=theme; root.setAttribute('role','group'); root.setAttribute('aria-label',(theme==='light'?'Light':'Dark')+' mode prototype');
 function render(){
  const keepScroll=root.querySelector('.scroll')?.scrollTop||0;
  root.innerHTML=header()+`<div class="sheet"><div class="scroll">${body(st)}</div></div>`+actions()+overlay(st);
  const sc=root.querySelector('.scroll'); if(sc) sc.scrollTop=keepScroll;
  if(p===6&&st.open){buildWheel(root,st,'el');buildWheel(root,st,'rl');}
  if(p===7&&st.open){buildDrum(root,st,'el');buildDrum(root,st,'rl');}
 }
 const tog=(k,v)=>{st[k]=st[k]===v?null:v;};
 root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||!root.contains(b)) return;
  const [a,v]=b.dataset.act.split(':');
  switch(a){
   case 'toggle': st.open=!st.open; if(st.open){st._enter=true; st.pel=st.el; st.prl=st.rl;} break;
   case 'close': st.open=false; break;
   case 'el': tog('el',v); break;
   case 'rl': tog('rl',v); break;
   case 'pel': tog('pel',v); break;
   case 'prl': tog('prl',v); break;
   case 'clear': st.el=null; st.rl=null; if(p===6||p===7){render();return;} break;
   case 'pclear': st.pel=null; st.prl=null; break;
   case 'apply': st.el=st.pel; st.rl=st.prl; st.open=false; break;
   case 'counter': st.el=COUNTER; st.rl=null; break;
   case 'wel': setWheel(root,st,'el',+v); return;
   case 'wrl': setWheel(root,st,'rl',+v); return;
   case 'del': setDrum(root,st,'el',+v); return;
   case 'drl': setDrum(root,st,'rl',+v); return;
  }
  render();
 });
 render();
 return root;
}

/* ---------------- slides ---------------- */
const track=document.getElementById('track');
SLIDES.forEach((s,i)=>{
 const el=document.createElement('section'); el.className='slide'; el.setAttribute('role','group'); el.setAttribute('aria-roledescription','slide'); el.setAttribute('aria-label',`${i+1} of 8: ${s.title}`);
 el.innerHTML=`<header><span class="tag">${s.tag}</span><h1>${esc(s.title)}</h1><p class="sub">${esc(s.sub)}</p></header>
  <div class="copy"><div class="block"><h2>THE IDEA</h2><p>${esc(s.idea)}</p></div><div class="block"><h2>HOW IT WORKS</h2><p>${esc(s.how)}</p></div>
  <div class="block"><h2>${s.pl}</h2><ul class="points">${s.points.map(t=>`<li><i>${SVG.check}</i>${esc(t)}</li>`).join('')}</ul></div>
  <div class="block"><h2>TRADE-OFF</h2><p>${esc(s.trade)}</p></div>
  <div class="score"><b>${s.score}</b><span><small>/ 10 \u00b7 RANK ${i+1} OF 8</small><em>${esc(s.verdict)}</em></span></div></div>
  <div class="panel"></div>`;
 const panel=el.querySelector('.panel');
 for(const theme of ['light','dark']){const d=document.createElement('div'); d.className='device'; d.innerHTML=`<span class="mode ${theme}">${theme.toUpperCase()} MODE</span><div class="pwrap"></div>`; d.querySelector('.pwrap').appendChild(makePhone(i+1,theme)); panel.appendChild(d);}
 if(i>0) el.inert=true;
 track.appendChild(el);
});

/* ---------------- navigation ---------------- */
let cur=0; const N=SLIDES.length;
const dots=document.getElementById('dots');
SLIDES.forEach((s,i)=>{const b=document.createElement('button'); b.setAttribute('role','tab'); b.setAttribute('aria-label',`Go to ${s.title}`); b.onclick=()=>go(i); dots.appendChild(b);});
document.getElementById('prev').innerHTML=SVG.chev; document.getElementById('next').innerHTML=SVG.chevR;
document.getElementById('prev').onclick=()=>go(cur-1); document.getElementById('next').onclick=()=>go(cur+1); document.getElementById('nextlbl').onclick=()=>go(cur+1);

function go(i){ if(i>=N) i=0; if(i<0) i=N-1; cur=i;
 track.style.transform=`translateX(${-100*i}%)`;
 [...track.children].forEach((s,k)=>{s.inert=k!==i;});
 [...dots.children].forEach((d,k)=>{d.classList.toggle('on',k===i); d.setAttribute('aria-selected',k===i);});
 document.getElementById('count').textContent=`${String(i+1).padStart(2,'0')} OF 08`;
  const n=(i+1)%N; document.getElementById('nextlbl').textContent=i===N-1?'BACK TO 01 \u00b7 INLINE TRAY  \u2192':`NEXT \u00b7 ${String(n+1).padStart(2,'0')} ${SLIDES[n].short}  \u2192`;
 try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return; if(e.key==='ArrowRight'){go(cur+1);} else if(e.key==='ArrowLeft'){go(cur-1);} else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(N-1);}});
/* swipe anywhere outside the phones */
const stage=document.getElementById('stage'); let sx=null,sy=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.phone')){sx=null;return;} sx=e.clientX; sy=e.clientY;});
stage.addEventListener('pointerup',e=>{if(sx===null)return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3) go(cur+(dx<0?1:-1));});
let wl=0; stage.addEventListener('wheel',e=>{if(e.target.closest('.wheel,.dz'))return; if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){e.preventDefault(); if(Math.abs(e.deltaX)>30){const now=Date.now(); if(now-wl>800){wl=now; go(cur+(e.deltaX>0?1:-1));}}}},{passive:false});

/* ---------------- fit phones to panel ---------------- */
function fit(){document.querySelectorAll('.panel').forEach(p=>{
 const mobile=innerWidth<=900; const h=mobile?innerHeight*.62:p.clientHeight-22-26; const w=(p.clientWidth-(mobile?36:90))/2;
 const s=Math.max(.3,Math.min(h/844,w/390,1)); p.style.setProperty('--s',s.toFixed(4));});}
addEventListener('resize',fit); fit(); requestAnimationFrame(fit);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);

/* ---------------- stars ---------------- */
(function(){const sky=document.querySelector('.sky'); let seed=7; const r=()=>(seed=(seed*9301+49297)%233280)/233280;
 for(let i=0;i<80;i++){const s=document.createElement('i'); s.className='star'; const z=r()*2+.8; s.style.cssText=`left:${r()*100}%;top:${r()*62}%;width:${z}px;height:${z}px;opacity:${(.2+r()*.6).toFixed(2)}`; sky.appendChild(s);}})();

const start=parseInt(location.hash.slice(1),10); go(start>=1&&start<=N?start-1:0);
</script>
</body>
